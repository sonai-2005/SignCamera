<!DOCTYPE html>
<html>
<head>
  <title>Gemini Test</title>
</head>
<body>

<h2>Test Gemini API</h2>

<input type="text" id="inputText" placeholder="Enter text" />
<button onclick="send()">Correct</button>

<p><b>Result:</b> <span id="result"></span></p>

<script>
async function send() {
  const text = document.getElementById("inputText").value;

  const res = await fetch("http://localhost:5001/correct", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("result").innerText = data.corrected || data.error;
}
</script>

</body>
</html>
